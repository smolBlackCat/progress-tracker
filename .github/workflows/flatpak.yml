name: Flatpak

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/flatpak.yml'

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          "submodules": true
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.smolblackcat.Progress.Devel.json
          bundle: progress.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
